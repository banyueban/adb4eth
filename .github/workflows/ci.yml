name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m unittest tests.test_smoke -v

  gui:
    name: GUI tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tk (headless) + customtkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install customtkinter
      - name: Run GUI tests under xvfb
        run: xvfb-run -a python -m unittest tests.test_gui -v

  build:
    name: Package (${{ matrix.os }})
    needs: [core, gui]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller customtkinter pillow
      - name: Generate app icon
        shell: bash
        run: |
          python scripts/make_icon.py
          test -f build_assets/icon.icns -o -f build_assets/icon.ico
      - name: Download platform-tools (bundled adb)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p platform-tools
          if [ "$RUNNER_OS" = "Windows" ]; then
            ADB_URL="https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          else
            ADB_URL="https://dl.google.com/android/repository/platform-tools-latest-darwin.zip"
          fi
          curl -fsSL -o pt.zip "$ADB_URL"
          unzip -o pt.zip -d pt_extract
          cp -r pt_extract/platform-tools/* platform-tools/
          chmod +x platform-tools/adb* 2>/dev/null || true
          test -f platform-tools/adb* && echo "platform-tools ready"
      - name: Build with PyInstaller
        run: python -m PyInstaller adb4eth.spec --noconfirm
      - name: Bundle platform-tools into artifact
        shell: bash
        run: |
          set -euxo pipefail
          # PyInstaller 的 datas 收集对 macOS BUNDLE 不生效，构建后手动复制，可控可靠
          if [ "$RUNNER_OS" = "Windows" ]; then
            DEST="dist/adb4eth/_internal"
          else
            DEST="dist/adb4eth.app/Contents/Resources"
          fi
          mkdir -p "$DEST/platform-tools"
          cp -r platform-tools/. "$DEST/platform-tools/"
          chmod +x "$DEST"/platform-tools/adb* 2>/dev/null || true
          echo "platform-tools copied to $DEST/platform-tools/"
      - name: Verify adb bundled
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/adb4eth/_internal/platform-tools/adb.exe && echo "Windows adb bundled OK" || { echo "ERROR: adb not bundled"; exit 1; }
          else
            test -f dist/adb4eth.app/Contents/Resources/platform-tools/adb && echo "macOS adb bundled OK" || { echo "ERROR: adb not bundled"; exit 1; }
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb4eth-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
